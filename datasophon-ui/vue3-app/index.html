<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noah大数据平台</title>
    <style>
      /* 加载动画样式 */
      .loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #f0f2f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-radius: 50%;
        border-top-color: #1890ff;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 16px;
      }
      .loader-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        color: #333;
        font-size: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // 路由调试和特殊路径处理
      (function() {
        // 记录URL信息，便于调试
        var pathname = window.location.pathname;
        var hash = window.location.hash;
        console.log('[Router Debug] 页面加载路径:', pathname);
        console.log('[Router Debug] 哈希部分:', hash);
        console.log('[Router Debug] 完整URL:', window.location.href);
        
        // 特殊路径处理
        if (pathname === '/colony-manage/storage' || pathname === '/colony-manage/framework') {
          console.log('[Router Special Handling] 检测到特殊路径:', pathname);
          
          // 添加"特殊路径处理中"的提示
          document.addEventListener('DOMContentLoaded', function() {
            var app = document.getElementById('app');
            if (app) {
              var loader = document.createElement('div');
              loader.className = 'loader';
              loader.id = 'special-path-loader';
              
              var spinner = document.createElement('div');
              spinner.className = 'loader-spinner';
              
              var text = document.createElement('div');
              text.className = 'loader-text';
              text.innerText = '正在处理特殊路径...';
              
              loader.appendChild(spinner);
              loader.appendChild(text);
              app.appendChild(loader);
              
              // 尝试转换为哈希模式
              setTimeout(function() {
                // 尝试使用哈希路由导航
                try {
                  window.location.href = '/#' + pathname;
                } catch(e) {
                  console.error('[Router] 哈希导航失败:', e);
                }
              }, 500);
            }
          });
        }
        
        // 处理哈希模式中的特殊路径
        if (hash) {
          var hashPath = hash.replace('#', '');
          if (hashPath === '/colony-manage/storage' || hashPath === '/colony-manage/framework') {
            console.log('[Router Special Handling] 检测到哈希模式特殊路径:', hashPath);
            
            // 设置本地存储标记，用于App.vue加载时识别
            try {
              localStorage.setItem('specialPath', hashPath);
              localStorage.setItem('specialPathTimestamp', Date.now().toString());
            } catch(e) {
              console.error('[Router] 设置本地存储失败:', e);
            }
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
