<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>存储库管理 | Noah大数据平台</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      max-width: 90%;
      width: 500px;
    }
    h1 {
      color: #2563eb;
      margin-bottom: 20px;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .btn-primary {
      background-color: #2563eb;
      color: white;
      border: none;
    }
    .btn-secondary {
      background-color: #f3f4f6;
      color: #1f2937;
      border: 1px solid #e5e7eb;
    }
    .btn:hover {
      opacity: 0.9;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    // 页面加载后执行导航逻辑
    window.addEventListener('DOMContentLoaded', function() {
      // 尝试使用多种导航策略
      
      // 1. 首先尝试哈希模式导航
      setTimeout(() => {
        try {
          console.log("[Direct Access] 尝试使用哈希路由导航");
          window.location.href = '/#/colony-manage/storage';
        } catch (e) {
          console.error("哈希导航失败:", e);
          // 如果失败，不要进行其他操作，让用户选择
        }
      }, 1000);
    });
    
    // 直接导航函数
    function directNavigate(mode) {
      try {
        if (mode === 'hash') {
          window.location.href = '/#/colony-manage/storage';
        } else if (mode === 'history') {
          window.location.href = '/colony-manage/storage';
        } else {
          window.location.href = '/';
        }
      } catch (e) {
        console.error("导航失败:", e);
        alert("导航失败，请尝试其他方式或刷新页面");
      }
    }
  </script>
</head>
<body>
  <div class="container">
    <h1>存储库管理</h1>
    <p>正在准备导航到存储库管理页面...</p>
    <div class="spinner"></div>
    <p>如果没有自动跳转，请选择以下导航方式：</p>
    <div class="buttons">
      <button onclick="directNavigate('hash')" class="btn btn-primary">哈希模式</button>
      <button onclick="directNavigate('history')" class="btn btn-secondary">历史模式</button>
      <a href="/" class="btn btn-secondary">返回首页</a>
    </div>
  </div>
</body>
</html>
