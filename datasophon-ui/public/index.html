<!DOCTYPE html>
<html lang="en" class="beauty-scroll">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="renderer" content="webkit">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <link rel="stylesheet" href="<%= BASE_URL %>assets/file-icons/file-icons.css">
    <script>
      // 清除缓存
      var menuData = localStorage.getItem('menuData');
      if (menuData) {
        try {
          var data = JSON.parse(menuData);
          
          // 找到Datasophon总览和集群总览菜单项
          var datasophonOverviewItem = null;
          var clusterOverviewItem = null;
          var datasophonIndex = -1;
          var clusterIndex = -1;
          
          // 更新菜单名称和图标
          data.forEach(function(item, index) {
            if (item.path === 'overview') {
              item.name = '集群总览';
              clusterOverviewItem = item;
              clusterIndex = index;
            }
            if (item.path === 'datasophon-overview') {
              item.name = 'Datasophon总览';
              if (item.meta) {
                item.meta.icon = 'datasophon-overview';
              }
              datasophonOverviewItem = item;
              datasophonIndex = index;
            }
          });
          
          // 调整菜单顺序，确保Datasophon总览在第一位
          if (datasophonIndex > 0 && clusterIndex >= 0 && datasophonIndex > clusterIndex) {
            // 移除Datasophon总览
            data.splice(datasophonIndex, 1);
            // 在集群总览前插入
            data.splice(clusterIndex, 0, datasophonOverviewItem);
            console.log('已调整菜单顺序，Datasophon总览现在在第一位');
          }
          
          // 保存回localStorage
          localStorage.setItem('menuData', JSON.stringify(data));
        } catch (e) {
          console.error('菜单数据解析错误', e);
        }
      }
    </script>

    <!-- 系统全局样式，覆盖各种问号图标 -->
    <style>
      /* 确保全局样式立即应用 */
      body.colony-manage-page {
        background-color: #f5f7fa !important;
      }
      
      /* 强制样式立即生效 */
      .colony-manage-page .cluster-card,
      .colony-manage-page .create-card,
      .colony-manage-page .mac-btn,
      .colony-manage-page .mac-dropdown-menu-item,
      .colony-manage-page .mac-dropdown-overlay {
        transition: none !important; /* 首次加载时禁用过渡效果 */
      }
      
      /* 页面加载完成后恢复过渡效果 */
      body.loaded .colony-manage-page .cluster-card,
      body.loaded .colony-manage-page .create-card,
      body.loaded .colony-manage-page .mac-btn,
      body.loaded .colony-manage-page .mac-dropdown-menu-item,
      body.loaded .colony-manage-page .mac-dropdown-overlay {
        transition: all 0.3s ease !important;
      }
      
      /* 解决aria-hidden警告 */
      div[tabindex="0"][aria-hidden="true"][style*="width: 0px"][style*="height: 0px"][style*="overflow: hidden"] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }
      
      /* 隐藏问号图标 */
      .anticon-question-circle,
      i.anticon-question-circle,
      svg[data-icon="question-circle"],
      [aria-label="icon: question-circle"],
      svg[viewBox="64 64 896 896"][data-icon="question-circle"],
      .ant-modal-confirm-title-wrap i.anticon,
      .ant-modal-header i.anticon,
      .ant-modal-body i.anticon {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        opacity: 0 !important;
        visibility: hidden !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
      }
      
      /* 全局修复确认框和模态框紫色容器问题 */
      .ant-modal-confirm .ant-modal-body,
      .ant-modal-confirm .ant-modal-content {
        padding: 0 !important;
        background-color: white !important;
        border-radius: 16px !important;
        overflow: hidden !important;
      }
      
      /* 移除模态框和确认框内多余的空间和边距 */
      .ant-modal-confirm-body-wrapper {
        padding: 0 !important;
        margin: 0 !important;
      }
      
      /* 移除确认框中的紫色容器 */
      .ant-modal-confirm-body > .anticon {
        display: none !important;
      }
      
      /* 确认框标题样式修复 */
      .ant-modal-confirm-title {
        padding: 16px 24px !important;
        margin: 0 !important;
        border-bottom: 1px solid #f0f0f0 !important;
        font-weight: 600 !important;
      }
      
      /* 确认框内容样式修复 */
      .ant-modal-confirm-content {
        margin: 0 !important;
        padding: 24px !important;
      }
      
      /* 确认框按钮区域样式修复 */

        margin: 0 !important;
        padding: 16px 24px !important;
        border-top: 1px solid #f0f0f0 !important;
        display: flex !important;
        justify-content: flex-end !important;
        gap: 8px !important;

      /* 删除集群确认框特殊样式 */

        padding: 0 !important;
      }
      
      /* 确保所有模态框和确认框的内容区域样式正确 */

        padding: 0 !important;
      }

      .ant-modal-wrap {

      }

        display: none !important;

      }

      .ant-modal-confirm-body > .anticon-info-circle,

        margin: initial !important;

        padding: initial !important;
        border-top: none !important;

        padding: 0 !important;
        margin: 0 !important;
      }
      
      /* 紧凑型确认框专用样式 */

        width: auto !important;
        max-width: 300px !important;
        margin: 0 auto !important;
      }
      
      .compact-modal .ant-modal-body {
        padding: 0 !important;
      }
      
      .compact-modal .ant-modal-title {

      }
      
      .compact-modal .ant-btn.mac-btn.primary-btn:hover {

      /* 服务管理启动/停止确认框 - 恢复按钮样式 */

      .service-action-confirm .ant-btn-primary:hover,
      .service-action-confirm .ant-btn-primary:focus {

        background-color: #40a9ff !important;
        border-color: #40a9ff !important;

      /* 服务管理弹窗中的问号图标正确显示 */
      .service-action-confirm .anticon-question-circle,

        visibility: visible !important;

    <script>

        document.body.classList.add('loaded');
