    <script>
      // 清除缓存
      var menuData = localStorage.getItem('menuData');
      if (menuData) {
        try {
          var data = JSON.parse(menuData);
          
          // 找到Datasophon总览和集群总览菜单项
          var datasophonOverviewItem = null;
          var clusterOverviewItem = null;
          var datasophonIndex = -1;
          var clusterIndex = -1;
          
          // 更新菜单名称和图标
          data.forEach(function(item, index) {
            if (item.path === 'overview') {
              item.name = '集群总览';
              clusterOverviewItem = item;
              clusterIndex = index;
            }
            if (item.path === 'datasophon-overview') {
              item.name = 'Datasophon总览';
              if (item.meta) {
                item.meta.icon = 'datasophon-overview';
              }
              datasophonOverviewItem = item;
              datasophonIndex = index;
            }
          });
          
          // 调整菜单顺序，确保Datasophon总览在第一位
          if (datasophonIndex > 0 && clusterIndex >= 0 && datasophonIndex > clusterIndex) {
            // 移除Datasophon总览
            data.splice(datasophonIndex, 1);
            // 在集群总览前插入
            data.splice(clusterIndex, 0, datasophonOverviewItem);
            console.log('已调整菜单顺序，Datasophon总览现在在第一位');
          }
          
          // 保存回localStorage
          localStorage.setItem('menuData', JSON.stringify(data));
        } catch (e) {
          console.error('菜单数据解析错误', e);
        }
      }
    </script>

    <script>
      // 在页面加载完成后添加loaded类和初始化DOM修复
      window.addEventListener('load', function() {
        document.body.classList.add('loaded');
        
        // 强力修复：手动替换服务确认框DOM结构
        function forceFixServiceConfirmDialogs() {
          // 找到所有确认框
          const allModals = document.querySelectorAll('.ant-modal-root');
          
          allModals.forEach(function(modal) {
            // 检查是否存在多余按钮区域
            const btnContainers = modal.querySelectorAll('.ant-modal-confirm-btns');
            
            // 找到所有可能有问题的模态框
            btnContainers.forEach(function(btnContainer) {
              // 彻底移除它们
              if (btnContainer && btnContainer.parentNode) {
                try {
                  btnContainer.parentNode.removeChild(btnContainer);
                } catch(e) {
                  console.warn('移除按钮容器失败:', e);
                }
              }
            });
            
            // 修复文本换行问题
            const confirmContents = modal.querySelectorAll('.ant-modal-confirm-content');
            confirmContents.forEach(function(content) {
              // 确保内容是居中且不换行的
              if (content) {
                content.style.setProperty('white-space', 'nowrap', 'important');
                content.style.setProperty('text-align', 'center', 'important');
                content.style.setProperty('width', '100%', 'important');
                content.style.setProperty('min-width', '250px', 'important');
                
                // 修复内部文本容器
                const textDivs = content.querySelectorAll('div > div');
                if (textDivs.length > 0) {
                  textDivs.forEach(function(div) {
                    div.style.setProperty('white-space', 'nowrap', 'important');
                    div.style.setProperty('text-align', 'center', 'important');
                    div.style.setProperty('display', 'block', 'important');
                    div.style.setProperty('width', '100%', 'important');
                    div.style.setProperty('padding', '0', 'important');
                  });
                }
              }
            });
          });
        }
        
        // 定期执行修复
        const fixInterval = setInterval(forceFixServiceConfirmDialogs, 100);
        
        // 增强型DOM监听
        const observer = new MutationObserver(function() {
          // 每当DOM变化时立即尝试修复
          setTimeout(forceFixServiceConfirmDialogs, 0);
          setTimeout(forceFixServiceConfirmDialogs, 50);
          setTimeout(forceFixServiceConfirmDialogs, 100);
        });
        
        // 监听整个文档的DOM变化
        observer.observe(document.body, { 
          childList: true, 
          subtree: true,
          attributes: true,
          attributeFilter: ['class', 'style']
        });
        
        // 针对按钮点击事件特别处理
        document.body.addEventListener('click', function() {
          // 点击事件可能会触发模态框，确保我们能够修复它
          setTimeout(forceFixServiceConfirmDialogs, 10);
          setTimeout(forceFixServiceConfirmDialogs, 100);
          setTimeout(forceFixServiceConfirmDialogs, 300);
        }, true);
      });
    </script>
    <script>
      // 在页面加载完成后添加loaded类
      window.addEventListener('load', function() {
        document.body.classList.add('loaded');
        
        // 已移除不需要的编辑集群模态框修复代码
        // 现在使用Vue的响应式方式处理表单验证，无需DOM操作
      });
    </script>
