    # 达梦
    # datasource.driver=dm.jdbc.driver.DmDriver
    # datasource.url=jdbc:dm://192.168.4.120:5236/DATASOPHON?rewriteBatchedStatements=true&useServerPrepStmts=false&allowMultiQueries=true
    # datasource.username=DATASOPHON
    # datasource.password=DATASOPHON

    # server
    server.port=8081
    server.address=0.0.0.0

    datasophon.migration.enable=true

    sso.active=false
    sso.auth-url=https://192.168.5.184:10000/index.html
    sso.server-url=https://192.168.5.174:10000/sso-server/
    sso.redis-nodes=192.168.5.160:6379,192.168.5.161:6379,192.168.5.162:6379
    sso.redis-password=zb@123
    sso.public-key=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCerqMJBTLxl/5ozlNeysw/SwuOPiqTTKd/j1MCm/2Zj/79VJ0FFvhKtOzOBYhoIu/QtlJPG2Lxrw3vNMksyqMiZ8Wca6a1/DgTicD/t8uTzx6buvfIR7GwccK1a/7u1mL2ZqddTIlmkvx/0IiAxXV2pDnQn1QS400O/xKr6RdXywIDAQAB


    IMAGE_REGISTRY=harbor.norintech.com
    language=chinese
    install.path=/opt/datasophon
    yaml.path=/project-code/noah-bigdata-platform
    masterHost=master01
    masterWebPort=8081
    frameCode=DDP-1.2.1
    clusterId=1
    rows=200
    times=20
    timeOutPeriodOne=1
    timeOutPeriodTwo=2
    HADOOP_HOME=/opt/datasophon/hadoop-3.3.3
    id_rsa=/.ssh/id_rsa

  application.yml: |-
    # Tomcat
    server:
      port: ${server.port:8081}
      address: ${server.ip:0.0.0.0}
      servlet:
        context-path: /ddh/
    security:
      authentication:
        type: PASSWORD
    # mysql
    spring:
      datasource:
        driver-class-name: ${datasource.driver:com.mysql.cj.jdbc.Driver}
        type: com.alibaba.druid.pool.DruidDataSource
        url: ${datasource.url:}
        username: ${datasource.username:datasophon}
        password: ${datasource.password:datasophon}
      #json格式化全局配置
      jackson:
        time-zone: GMT+8
        date-format: yyyy-MM-dd HH:mm:ss
      mvc:
        date-format: yyyy-MM-dd HH:mm:ss
        view:
          suffix: .html
      #国际化配置
      messages:
        basename: i18n/messages
        encoding: UTF-8
      main:
        allow-circular-references: true
      web:
        resources:
          static-locations: classpath:/front/views/
          
    # Jasypt加密配置
    jasypt:
      encryptor:
        algorithm: PBEWithMD5AndDES
        # 加密密钥可以通过环境变量或启动参数设置: -Djasypt.encryptor.password=your_key
        password: ${JASYPT_PASSWORD}
        iv-generator-classname: org.jasypt.iv.NoIvGenerator
          
    # Prometheus监控配置
    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus,loggers,metrics
      endpoint:
        prometheus:
          enabled: true
        health:
          show-details: always
        loggers:
          enabled: true
      metrics:
        export:
          prometheus:
            enabled: true
        tags:
          application: ${spring.application.name:datasophon-api}
        enable:
          jvm: true
          logback: true
          process: true
          system: true
          
    #mybatis
    mybatis-plus:
      mapper-locations: classpath*:/mapper/*.xml
      #实体扫描，多个package用逗号或者分号分隔
      typeAliasesPackage: com.datasophon.dao.entity
      typeEnumsPackage: com.datasophon.dao.enums,com.datasophon.domain.host.enums
      global-config:
        #数据库相关配置
        db-config:
          #主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
          id-type: AUTO
          #字段策略 IGNORED:"忽略判断",NOT_NULL:"非 NULL 判断"),NOT_EMPTY:"非空判断"
          field-strategy: NOT_NULL
          #驼峰下划线转换
          column-underline: true
          logic-delete-value: -1
          logic-not-delete-value: 0
        banner: false
      #原生配置
      configuration:
        map-underscore-to-camel-case: true
        cache-enabled: false
        call-setters-on-nulls: true
        jdbc-type-for-null: 'null'
    #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    logging:
      config: classpath:logback-api.xml

    datasophon:
      migration:
        enable: ${datasophon.migration.enable:true}

    sa-token:
      # SSO-相关配置
      sso:
        auth-url: ${sso.auth-url:https://192.168.5.184:10000/index.html} # 单点登录登录页面地址url
        # 是否打开单点注销接口
        is-slo: true
        server-url: ${sso.server-url:https://192.168.5.174:10000/sso-server/}
        servicecode: NOAH # 系统编码
        public-key: ${sso.public-key:MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCerqMJBTLxl/5ozlNeysw/SwuOPiqTTKd/j1MCm/2Zj/79VJ0FFvhKtOzOBYhoIu/QtlJPG2Lxrw3vNMksyqMiZ8Wca6a1/DgTicD/t8uTzx6buvfIR7GwccK1a/7u1mL2ZqddTIlmkvx/0IiAxXV2pDnQn1QS400O/xKr6RdXywIDAQAB}
        exclude-urls:
          - /sso/getSsoAuthUrl
          - /sso/doLoginByTicket
          - /sso/isLogin
          - /login
          - /signOut
          - /ssoEnable
          - /
          - /static/**
          - /webjars/**
          - /ui/**
        active: ${sso.active:true}
        isHttp: true
      #是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录) =-1
      isConcurrent: true
      #在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
      isShare: false
      # 是否使用redis存储信息，默认false使用内存来存储信息，true使用spring redis存储信息（请配置spring redis），若配置下述alone-redis，则使用下述alone-redis存储信息（不必再配置spring redis）。
      redis-enabled: true
      # 配置Sa-Token单独使用的Redis连接 （此处需要和SSO-Server端连接同一个Redis）
      alone-redis:
        #是否启用独立的redis来存储信息，此处为true时，redis-enabled也要设置为true
        enabled: true
        cluster:
          nodes: ${sso.redis-nodes:192.168.5.160:6379,192.168.5.161:6379,192.168.5.162:6379}
          # Redis服务器连接密码（默认为空）
        password: ${sso.redis-password:}
        # 连接超时时间
        timeout: 10s
        lettuce:
          pool:
            # 连接池最大连接数
            max-active: 200
            # 连接池最大阻塞等待时间（使用负值表示没有限制）
            max-wait: -1ms
            # 连接池中的最大空闲连接
            max-idle: 10
            # 连接池中的最小空闲连接
            min-idle: 0

  application.conf: |-
    akka {
      actor {
        provider = "akka.remote.RemoteActorRefProvider"
      }
      remote {
        enabled-transports = ["akka.remote.netty.tcp"]
        netty.tcp {
          hostname = "0.0.0.0"
          port = 2551
          bind-hostname = "0.0.0.0"
          bind-port = 2551
        }
        log-config-on-start = on
        log-sent-messages = on
        log-received-messages = on
      }
    }
    my-forkjoin-dispatcher{
        type=Dispatcher
        executor="fork-join-executor"
        fork-join-executor{
            parallelism-min=10,
            parallelism-factor=3.0,
            parallelism-max=30
        }
        throughput=1
    }

    my-pinned-dispatcher {
        executor = "thread-pool-executor"
        type = PinnedDispatcher
    }

  logback-api.xml: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <!--
      ~  Licensed to the Apache Software Foundation (ASF) under one or more
      ~  contributor license agreements.  See the NOTICE file distributed with
      ~  this work for additional information regarding copyright ownership.
      ~  The ASF licenses this file to You under the Apache License, Version 2.0
      ~  (the "License"); you may not use this file except in compliance with
      ~  the License.  You may obtain a copy of the License at
      ~
      ~     http://www.apache.org/licenses/LICENSE-2.0
      ~
      ~  Unless required by applicable law or agreed to in writing, software
      ~  distributed under the License is distributed on an "AS IS" BASIS,
      ~  WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
      ~  See the License for the specific language governing permissions and
      ~  limitations under the License.
      -->

    <!-- Logback configuration. See http://logback.qos.ch/manual/index.html -->
    <configuration scan="true" scanPeriod="120 seconds"> <!--debug="true" -->

        <property name="log.base" value="logs"/>
        <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
            <encoder>
                <pattern>
                    [%level] %date{yyyy-MM-dd HH:mm:ss} %logger{96}:[%line] - %msg%n
                </pattern>
                <charset>UTF-8</charset>
            </encoder>
        </appender>
        <appender name="TASKLOGFILE" class="ch.qos.logback.classic.sift.SiftingAppender">
            <filter class="com.datasophon.api.log.TaskLogFilter"/>
            <Discriminator class="com.datasophon.api.log.TaskLogDiscriminator">
                <key>taskAppId</key>
                <logBase>${log.base}</logBase>
            </Discriminator>
            <sift>
                <appender name="FILE-${taskAppId}" class="ch.qos.logback.core.FileAppender">
                    <file>${log.base}/${taskAppId}.log</file>
                    <encoder>
                        <pattern>
                            [%level] %date{yyyy-MM-dd HH:mm:ss} %logger{96}:[%line] - %msg%n
                        </pattern>
                        <charset>UTF-8</charset>
                    </encoder>
                    <append>true</append>
                </appender>
            </sift>
        </appender>
        <!-- api server logback config start -->
        <appender name="APILOGFILE" class="ch.qos.logback.core.rolling.RollingFileAppender">
            <file>${log.base}/datasophon-api.log</file>
            <filter class="ch.qos.logback.classic.filter.ThresholdFilter">
                <level>INFO</level>
            </filter>
            <rollingPolicy class="ch.qos.logback.core.rolling.SizeAndTimeBasedRollingPolicy">
                <fileNamePattern>${log.base}/datasophon-api.%d{yyyy-MM-dd_HH}.%i.log</fileNamePattern>
                <maxHistory>168</maxHistory>
                <maxFileSize>64MB</maxFileSize>
            </rollingPolicy>
            <encoder>
                <pattern>
                    [%level] %date{yyyy-MM-dd HH:mm:ss} %logger{96}:[%line] - %msg%n
                </pattern>
                <charset>UTF-8</charset>
            </encoder>
        </appender>
        <!-- 文件 滚动日志 (仅error)-->
        <appender name="errorlog" class="ch.qos.logback.core.rolling.RollingFileAppender">
            <!-- 当前日志输出路径、文件名 -->
            <file>${log.base}/datasophon-api-error.log</file>
            <!--日志输出格式-->
            <encoder>
                <pattern>%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n</pattern>
                <charset>UTF-8</charset>
            </encoder>

            <!--历史日志归档策略-->
            <rollingPolicy class="ch.qos.logback.core.rolling.SizeAndTimeBasedRollingPolicy">
                <!-- 历史日志： 归档文件名 -->
                <fileNamePattern>${log.base}/datasophon-api-error.%d{yyyy-MM-dd_HH}.%i.log</fileNamePattern>
                <!--单个文件的最大大小-->
                <maxFileSize>64MB</maxFileSize>
                <!--日志文件保留天数-->
                <maxHistory>168</maxHistory>
            </rollingPolicy>

            <!-- 此日志文档只记录error级别的 -->
            <filter class="ch.qos.logback.classic.filter.LevelFilter">
                <level>error</level>
                <onMatch>ACCEPT</onMatch>
                <onMismatch>DENY</onMismatch>
            </filter>
        </appender>

        <!-- JMX指标导出配置 -->
        <jmxConfigurator/>
        
        <!-- 添加Metrics指标收集器 -->
        <appender name="METRICS" class="ch.qos.logback.core.rolling.RollingFileAppender">
            <file>${log.base}/metrics.log</file>
            <rollingPolicy class="ch.qos.logback.core.rolling.TimeBasedRollingPolicy">
                <fileNamePattern>${log.base}/metrics.%d{yyyy-MM-dd}.log</fileNamePattern>
                <maxHistory>7</maxHistory>
            </rollingPolicy>
            <encoder>
                <pattern>%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n</pattern>
                <charset>UTF-8</charset>
            </encoder>
        </appender>
        
        <!-- 为Logback指标配置特定的Logger -->
        <logger name="ch.qos.logback" level="INFO" additivity="false">
            <appender-ref ref="METRICS"/>
            <appender-ref ref="STDOUT"/>
        </logger>

        <!-- root 级别的配置 -->
        <root level="INFO">
            <appender-ref ref="STDOUT"/>
            <appender-ref ref="APILOGFILE"/>
            <appender-ref ref="errorlog"/>
            <appender-ref ref="TASKLOGFILE"/>
        </root>


    </configuration>

---
apiVersion: v1
kind: Service
metadata:
  name: datasophon-api-service
  labels:
    app: datasophon-manager
  namespace: datasophon
spec:
  selector:
    app: datasophon-manager
  ports:
    - port: 8081
      targetPort: 8081
      name: http
    - port: 8586
      targetPort: 8586
      name: metrics
    - port: 2551
      targetPort: 2551
      name: akka
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: datasophon-ui-service
  labels:
    app: datasophon-ui
  namespace: datasophon
spec:
  selector:
    app: datasophon-ui
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasophon-manager
  labels:
    app: datasophon-manager
  namespace: datasophon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datasophon-manager
  template:
    metadata:
      labels:
        app: datasophon-manager
    spec:
      containers:
        - name: datasophon-manager
          image: harbor.norintech.com/bdp/datasophon-manager:latest
          imagePullPolicy: Always
          env:
            - name: RUNNING_IN_K8S
              value: "true"
            # 从Secret引入数据库配置
            - name: datasource.url
              valueFrom:
                secretKeyRef:
                  name: datasophon-db-secrets
                  key: db_url
            - name: datasource.username
              valueFrom:
                secretKeyRef:
                  name: datasophon-db-secrets
                  key: db_username
            - name: datasource.password
              valueFrom:
                secretKeyRef:
                  name: datasophon-db-secrets
                  key: db_password
            # 设置Jasypt加密密钥
            - name: JASYPT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datasophon-db-secrets
                  key: jasypt_password
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 8586
              name: metrics
            - containerPort: 2551
              name: akka
            - containerPort: 8000
              name: debug
          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          readinessProbe:
            httpGet:
              path: /ddh/actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ddh/actuator/health/liveness
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: config-volume
              mountPath: /tmp/config
            - name: hosts-file
              mountPath: /tmp/hosts
          command: ['sh', '-c', 'cat /tmp/hosts >> /etc/hosts && mkdir -p /datasophon-manager/conf && cp -f /tmp/config/* /datasophon-manager/conf/ && bin/datasophon-api.sh start api && tail -F -f logs/datasophon-api.log']
      volumes:
        - name: config-volume
          configMap:
            name: datasophon-config
        - name: hosts-file
          hostPath:
            path: /etc/hosts

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasophon-ui
  labels:
    app: datasophon-ui
  namespace: datasophon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datasophon-ui
  template:
    metadata:
      labels:
        app: datasophon-ui
    spec:
      containers:
        - name: datasophon-ui
          image: harbor.norintech.com/bdp/datasophon-ui:latest
          imagePullPolicy: Always
          env:
            - name: RUNNING_IN_K8S
              value: "true"
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
      initContainers:
        - name: wait-for-backend
          image: harbor.norintech.com/bdp/busybox:1.28
          command: ['sh', '-c', 'until wget -T 5 -q --spider http://datasophon-api-service:8081/ddh/actuator/health/liveness; do echo waiting for backend; sleep 5; done;']

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datasophon-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE, PATCH"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
  namespace: datasophon
spec:
  ingressClassName: nginx
  rules:
    - host: datasophon.noah.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: datasophon-ui-service
                port:
                  number: 80 