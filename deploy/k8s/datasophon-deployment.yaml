apiVersion: v1
kind: ConfigMap
metadata:
  name: datasophon-config
  namespace: datasophon
data:
  datasophon.conf: |-
    # this file has the highest priority, if val is not blank, then will replace the config

    # datasource config
    # mysql
    datasource.driver=com.mysql.cj.jdbc.Driver
    datasource.url=jdbc:mysql://datasophon-mysql:3306/ddp?&useUnicode=true&characterEncoding=utf-8
    datasource.username=datasophon
