server {
    listen       80;
    server_name  localhost;

    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;

    # 根路径重定向到/ddh/
    location = / {
        return 301 /ddh/;
    }

    # 处理/ddh不带斜杠的情况，重定向到带斜杠的版本
    location = /ddh {
        return 301 /ddh/;
    }

    # 处理特定的后端路径前缀，这些路径没有使用api前缀
    location ~ ^/ddh/(cluster|alert)/ {
        # 不是静态资源和明确的前端路由才代理到后端
        if ($request_uri !~ \.(js|css|html|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$) {
            proxy_pass http://datasophon-api-service:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 增加超时设置
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            
            # 调试用日志
            access_log /var/log/nginx/backend_access.log;
            error_log /var/log/nginx/backend_error.log debug;
            break;
        }
    }

    # 处理/ddh/路径请求，映射到/app目录
    location /ddh/ {
        alias   /app/;
        index  index.html index.htm;
        try_files $uri $uri/ /app/index.html;
    }

    # 明确处理静态资源 - 修复权限问题
    location /ddh/static/ {
        alias /app/static/;
        autoindex on; # 临时打开目录索引以便调试
        add_header X-Debug-Path $document_root$fastcgi_path_info;
        add_header X-Debug-Uri $uri;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ =404;
    }

    # 处理/ddh/api/请求，代理到后端
    location /ddh/api/ {
        proxy_pass http://datasophon-api-service:8081/ddh/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 增加超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        
        # 调试用日志
        access_log /var/log/nginx/api_access.log;
        error_log /var/log/nginx/api_error.log debug;
    }

    # 处理/ddh/login请求，代理到后端
    location = /ddh/login {
        proxy_pass http://datasophon-api-service:8081/ddh/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 增加超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 处理/ddh/actuator请求，代理到后端
    location /ddh/actuator/ {
        proxy_pass http://datasophon-api-service:8081/ddh/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /app;
    }
} 