server {
    listen       80;
    server_name  localhost datasophon.noah.com;

    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;

    # 根路径重定向到/ddh/
    location = / {
        return 301 /ddh/;
    }

    # 处理/ddh不带斜杠的情况，重定向到带斜杠的版本
    location = /ddh {
        return 301 /ddh/;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # 明确处理静态资源
    location /ddh/static/ {
        alias /app/static/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 处理所有API请求，保持完整URI
    location ~* ^/ddh/(api/|login|logout|cluster/|alert/|autoScale/|doc/|host/|notice/|service/|signOut|sso/|ssoEnable|saveSsoUser|actuator/) {
        proxy_pass http://datasophon-api-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 处理/ddh/路径请求，映射到/app目录（前端静态文件），需要放在最后作为兜底
    location /ddh/ {
        alias   /app/;
        index  index.html index.htm;
        try_files $uri $uri/ /app/index.html;
    }

    # 捕获404错误并重定向到/ddh/
    error_page 404 = @notfound;
location @notfound {
return 302 /ddh/;
}

# redirect server error pages to the static page /50x.html
error_page   500 502 503 504  /50x.html;
location = /50x.html {
root   /app;
}
} 