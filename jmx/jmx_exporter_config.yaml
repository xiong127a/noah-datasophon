---
lowercaseOutputLabelNames: true
lowercaseOutputName: true
whitelistObjectNames: ["java.lang:type=OperatingSystem", "ch.qos.logback.core.Appender:*"]
blacklistObjectNames: []
rules:
  - pattern: 'java.lang<type=OperatingSystem><>(committed_virtual_memory|free_physical_memory|free_swap_space|total_physical_memory|total_swap_space)_size:'
    name: os_$1_bytes
    type: GAUGE
    attrNameSnakeCase: true
  - pattern: 'java.lang<type=OperatingSystem><>((?!process_cpu_time)\w+):'
    name: os_$1
    type: GAUGE
    attrNameSnakeCase: true
  # Logback指标
  - pattern: 'ch.qos.logback<name=(.+), type=(.+)><>Count'
    name: logback_$1_$2_count
    type: COUNTER
  - pattern: 'ch.qos.logback<name=(.+), type=(.+)><>TotalDuration'
    name: logback_$1_$2_duration_seconds_total
    type: COUNTER
  - pattern: 'ch.qos.logback<name=(.+), type=(.+)><>Mean'
    name: logback_$1_$2_duration_seconds_mean
    type: GAUGE
  - pattern: 'ch.qos.logback<name=(.+), type=(.+)><>Max'
    name: logback_$1_$2_duration_seconds_max
    type: GAUGE
  - pattern: 'ch.qos.logback<name=(.+), type=(.+)><>Min'
    name: logback_$1_$2_duration_seconds_min
    type: GAUGE
  - pattern: 'ch.qos.logback<name=(.+), type=(.+)><>StdDev'
    name: logback_$1_$2_duration_seconds_stddev
    type: GAUGE