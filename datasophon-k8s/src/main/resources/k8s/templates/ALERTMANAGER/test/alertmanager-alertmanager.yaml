apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  labels:
    name: "alertmanager-alertmanager"
  name: "alertmanager-alertmanager"
  namespace: datasophon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "alertmanager-alertmanager"
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  minReadySeconds: 5
  revisionHistoryLimit: 10
  template:
    metadata:
      labels:
        name: "alertmanager-alertmanager"
        app: "alertmanager-alertmanager"
        podConflictName: "alertmanager-alertmanager"
      annotations:
        serviceInstanceName: "alertmanager"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  name: "alertmanager-alertmanager"
                  podConflictName: "alertmanager-alertmanager"
              namespaces:
                - "datasophon"
              topologyKey: "kubernetes.io/hostname"
      hostPID: false
      hostNetwork: true
      containers:
        - env:
            - name: USER
              value: root
            - name: MEM_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          image: "192.168.5.200:5000/bdp/alertmanager:0.23.0"
          imagePullPolicy: "Always"
          command:
            - "/bin/bash"
            - "-c"
            - "cd /opt/datasophon/alertmanager-0.23.0 && sh control.sh start alertmanager && exec tail -f /dev/null"
          readinessProbe:
            exec:
              command:
                - "/bin/bash"
                - "-c"
                - "cd /opt/datasophon/alertmanager-0.23.0 && sh control.sh status alertmanager"
            failureThreshold: 3
            initialDelaySeconds: 3
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 15
          name: "alertmanager-alertmanager"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: "/opt/datasophon/alertmanager-0.23.0/alertmanager.yml"
              name: "config1"
            - mountPath: "/opt/datasophon/alertmanager-0.23.0/logs"
              name: "logs"
            - mountPath: "/etc/localtime"
              name: "timezone"
      nodeSelector:
        alertmanager-alertmanager: "true"
      terminationGracePeriodSeconds: 30
      volumes:
        - hostPath:
            path: "/opt/datasophon/alertmanager-0.23.0/alertmanager.yml"
          name: "config1"
        - hostPath:
            path: "/opt/datasophon/alertmanager-0.23.0/logs"
          name: "logs"
        - hostPath:
            path: "/etc/localtime"
          name: "timezone"