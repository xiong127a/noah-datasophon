pekko {
  actor {
    provider = "remote"
  }
  remote {
    artery {
      transport = tcp
      # Master需要接收Worker的回复消息，使用动态端口
      canonical.hostname = "127.0.0.1"  # 会被ActorUtils中的代码覆盖为实际IP
      canonical.port = 0  # 动态端口
      bind.hostname = "0.0.0.0"  # 监听所有网络接口，允许Worker回复消息
      bind.port = 0  # 动态端口
    }
    log-config-on-start = on
    log-sent-messages = on
    log-received-messages = on
  }
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
}
my-forkjoin-dispatcher{
    type=Dispatcher
    executor="fork-join-executor"
    fork-join-executor{
        parallelism-min=10,
        parallelism-factor=3.0,
        parallelism-max=30
    }
    throughput=1
}

my-pinned-dispatcher {
    executor = "thread-pool-executor"
    type = PinnedDispatcher
}