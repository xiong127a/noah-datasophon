# Tomcat
server:
  port: ${server.port:8081}
  address: ${server.ip:0.0.0.0}
  servlet:
    context-path: /ddh/

arthas:
  telnet-port: -1
  http-port: -1
# mysql
spring:
  security:
    enabled: true
  config:
    import: classpath:checker-config.yml
  datasource:
    driver-class-name: ${datasource.driver:com.mysql.cj.jdbc.Driver}
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${datasource.url:}
    username: ${datasource.username:datasophon}
    password: ${datasource.password:datasophon}
    # Druid连接池配置 - 解决启动慢问题的关键配置
    druid:
      # 初始连接数，启动时建立的连接数
      initial-size: 5
      # 最小空闲连接数，保持的最小连接数
      min-idle: 5
      # 最大活跃连接数
      max-active: 20
      # 获取连接等待超时时间(毫秒)
      max-wait: 3000
      # 连接有效性检测时间间隔(毫秒)
      time-between-eviction-runs-millis: 60000
      # 连接在池中最小生存的时间(毫秒)
      min-evictable-idle-time-millis: 300000
      # 用来检测连接是否有效的sql，要求是一个查询语句
      validation-query: SELECT 1
      # 申请连接时执行validationQuery检测连接是否有效，开启会降低性能，默认为true
      test-on-borrow: false
      # 归还连接时执行validationQuery检测连接是否有效，开启会降低性能，默认为true
      test-on-return: false
      # 申请连接的时候检测，建议配置为true，不影响性能，并且保证安全性
      test-while-idle: true
      # 是否缓存preparedStatement，也就是PSCache，PSCache对支持游标的数据库性能提升巨大
      pool-prepared-statements: true
      # 要启用PSCache，必须配置大于0，当大于0时，poolPreparedStatements自动触发修改为true
      max-pool-prepared-statement-per-connection-size: 20
      # 配置监控统计拦截的filters，stat:监控统计、log4j：日志记录、wall：防御sql注入
      filters: stat,wall
      # 合并多个DruidDataSource的监控数据
      use-global-data-source-stat: true
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500
  #json格式化全局配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    date-format: yyyy-MM-dd HH:mm:ss
    view:
      suffix: .html
  #国际化配置
  messages:
    basename: i18n/messages
    encoding: UTF-8
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  web:
    resources:
      static-locations:
        classpath:/META-INF/resources/,
        classpath:/resources/,
        classpath:/static/,
        classpath:/public/,
        classpath:/front/views/,
        classpath*:/lic/
  # Flyway配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    out-of-order: false
    validate-on-migrate: true
    placeholder-replacement: false
    repair: true

# Jasypt加密配置
jasypt:
  encryptor:
    algorithm: PBEWithMD5AndDES
    # 加密密钥可以通过环境变量或启动参数设置: -Djasypt.encryptor.password=your_key
    password: ${JASYPT_PASSWORD}
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

# Prometheus监控配置
management:
  server:
    port: 8082  # 添加明确的管理端口，与主应用端口分离
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers,metrics
  endpoint:
    prometheus:
      access: unrestricted
    health:
      show-details: always
    loggers:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name:datasophon-api}
    enable:
      jvm: true
      logback: true
      process: true
      system: true
  prometheus:
    metrics:
      export:
        enabled: true

#mybatis-flex
mybatis-flex:
  mapper-locations: classpath*:/mapper/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  type-aliases-package: com.datasophon.dao.entity
  type-handlers-package: com.datasophon.dao.enums,com.datasophon.domain.host.enums
  configuration:
    map-underscore-to-camel-case: true
    # 开启二级缓存
    cache-enabled: true
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    # 设置执行器类型为REUSE，复用PreparedStatement
    default-executor-type: REUSE
    # 设置合理的超时时间(秒)
    default-statement-timeout: 30
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    print-banner: false
    # 主键策略
    key-config:
      key-type: AUTO


logging:
  config: classpath:logback-api.xml
  level:
    org.pf4j: DEBUG
    com.datasophon.plugins: DEBUG

datasophon:
  migration:
    enable: ${datasophon.migration.enable:true}
  
  # Temporal工作流引擎配置 (按需加载优化)
  temporal:
    enabled: false                              # 默认禁用，仅在需要使用工作流功能时启用
    server:
      host: localhost
      port: 7233
    namespace: default
    task-queue: host-check-task-queue
    worker:
      max-concurrent-workflow-task-pollers: 5
      max-concurrent-activity-task-pollers: 10
  
  # 插件管理器配置 (延迟加载优化)  
  plugins:
    # 插件目录（根目录统一插件目录）
    directory: plugins
    
    # 开发模式配置
    development:
      # 是否启用开发模式（开发时设为true，生产时设为false）
      enabled: true
      # 开发模式下的插件路径（指向编译后的classes目录）
      plugin-paths:
        - datasophon-plugins/datasophon-plugins-impl/core-plugins/ssh-connector-plugin/target/classes
        - datasophon-plugins/datasophon-plugins-impl/core-plugins/host-repair-plugin/target/classes
        - datasophon-plugins/datasophon-plugins-impl/core-plugins/host-validation-plugin/target/classes
        - datasophon-plugins/datasophon-plugins-impl/core-plugins/system-info-collector-plugin/target/classes
    
    # 额外的插件扫描路径（可选）
    scan-paths: []
    
    # 插件加载配置
    loading:
      enabled: true                           # 插件功能总开关
      lazy: false                             # 禁用延迟加载 - 启动时立即加载插件
      hot-reload: true                        # 支持热重载
      
    # SSH连接池配置
    ssh-connection-pool:
      # 全局默认配置
      default:
        max-total: 10
        max-idle: 5  
        min-idle: 2
        max-wait-millis: 30000
        test-on-borrow: true
        test-on-return: true
        test-while-idle: true
        time-between-eviction-runs-millis: 30000
        min-evictable-idle-time-millis: 300000
        
      # 主机特定配置（可选）
      hosts:
        "192.168.1.100":
          max-total: 20
          max-idle: 10
        "192.168.1.101":
          max-total: 15
          max-idle: 8

jwt:
  # JWT密钥 - 使用base64编码的秘钥
  secret: ZGF0YXNvcGhvbkpXVFNlY3JldEtleUZvclNwcmluZ0Jvb3QzQXBwbGljYXRpb25TZWNyZXQ=
  # Token有效期（毫秒）- 默认24小时
  expiration: 86400000

# db-scheduler UI配置（官方标准配置）
db-scheduler-ui:
  enabled: true                          # 启用Web UI界面
  read-only: false                       # 只读模式：false=可操作，true=只读
  task-data: true                        # 显示任务数据
  history: true                          # 显示执行历史
  log-limit: 1000                        # 日志显示限制
  context-path: ddh                      # 设置UI前缀路径

# db-scheduler执行历史配置
db-scheduler-log:
  enabled: true                         # 启用执行历史
  table-name: scheduled_execution_logs  # 执行日志表名

# 应用自定义配置
app:
  headers:
    names:
      - Authorization
      - X-User-Id
      - X-Tenant-Id
      - X-Client-Version
      - X-Request-ID
      - grafanaHost
      # 可以添加更多需要处理的请求头
