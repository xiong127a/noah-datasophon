# Tomcat
server:
  port: ${server.port:8081}
  address: ${server.ip:0.0.0.0}
  servlet:
    context-path: /ddh/

arthas:
  telnet-port: -1
  http-port: -1
# mysql
spring:
  security:
    enabled: true
  config:
    import: classpath:checker-config.yml
  datasource:
    driver-class-name: ${datasource.driver:com.mysql.cj.jdbc.Driver}
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${datasource.url:}
    username: ${datasource.username:datasophon}
    password: ${datasource.password:datasophon}
    # Druid连接池配置 - 解决启动慢问题的关键配置
    druid:
      # 初始连接数，启动时建立的连接数
      initial-size: 5
      # 最小空闲连接数，保持的最小连接数
      min-idle: 5
      # 最大活跃连接数
      max-active: 20
      # 获取连接等待超时时间(毫秒)
      max-wait: 3000
      # 连接有效性检测时间间隔(毫秒)
      time-between-eviction-runs-millis: 60000
      # 连接在池中最小生存的时间(毫秒)
      min-evictable-idle-time-millis: 300000
      # 用来检测连接是否有效的sql，要求是一个查询语句
      validation-query: SELECT 1
      # 申请连接时执行validationQuery检测连接是否有效，开启会降低性能，默认为true
      test-on-borrow: false
      # 归还连接时执行validationQuery检测连接是否有效，开启会降低性能，默认为true
      test-on-return: false
      # 申请连接的时候检测，建议配置为true，不影响性能，并且保证安全性
      test-while-idle: true
      # 是否缓存preparedStatement，也就是PSCache，PSCache对支持游标的数据库性能提升巨大
      pool-prepared-statements: true
      # 要启用PSCache，必须配置大于0，当大于0时，poolPreparedStatements自动触发修改为true
      max-pool-prepared-statement-per-connection-size: 20
      # 配置监控统计拦截的filters，stat:监控统计、log4j：日志记录、wall：防御sql注入
      filters: stat,wall
      # 合并多个DruidDataSource的监控数据
      use-global-data-source-stat: true
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500
  #json格式化全局配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    date-format: yyyy-MM-dd HH:mm:ss
    view:
      suffix: .html
  #国际化配置
  messages:
    basename: i18n/messages
    encoding: UTF-8
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  web:
    resources:
      static-locations:
        classpath:/META-INF/resources/,
        classpath:/resources/,
        classpath:/static/,
        classpath:/public/,
        classpath:/front/views/,
        classpath*:/lic/
  # Flyway配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    out-of-order: false
    validate-on-migrate: true
    placeholder-replacement: false
    repair: true

# Jasypt加密配置
jasypt:
  encryptor:
    algorithm: PBEWithMD5AndDES
    # 加密密钥可以通过环境变量或启动参数设置: -Djasypt.encryptor.password=your_key
    password: ${JASYPT_PASSWORD}
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

# Prometheus监控配置
management:
  server:
    port: 8082  # 添加明确的管理端口，与主应用端口分离
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers,metrics
  endpoint:
    prometheus:
      access: unrestricted
    health:
      show-details: always
    loggers:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name:datasophon-api}
    enable:
      jvm: true
      logback: true
      process: true
      system: true
  prometheus:
    metrics:
      export:
        enabled: true

#mybatis-flex
mybatis-flex:
  mapper-locations: classpath*:/mapper/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  type-aliases-package: com.datasophon.dao.entity
  type-handlers-package: com.datasophon.dao.enums,com.datasophon.domain.host.enums
  configuration:
    map-underscore-to-camel-case: true
    # 开启二级缓存
    cache-enabled: true
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    # 设置执行器类型为REUSE，复用PreparedStatement
    default-executor-type: REUSE
    # 设置合理的超时时间(秒)
    default-statement-timeout: 30
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    print-banner: false
    # 主键策略
    key-config:
      key-type: AUTO


logging:
  config: classpath:logback-api.xml

datasophon:
  migration:
    enable: ${datasophon.migration.enable:true}
  
  # Temporal工作流引擎配置 (按需加载优化)
  temporal:
    enabled: false                              # 默认禁用，仅在需要使用工作流功能时启用
    server:
      host: localhost
      port: 7233
    namespace: default
    task-queue: host-check-task-queue
    worker:
      max-concurrent-workflow-task-pollers: 5
      max-concurrent-activity-task-pollers: 10
  
  # 插件管理器配置 (延迟加载优化)  
  plugins:
    directory: plugins
    loading:
      enabled: true                           # 插件功能总开关
      lazy: true                              # 启用延迟加载 - 显著减少启动时间
      hot-reload: true                        # 支持热重载
    ssh-connection-pool:
      default-config:
        max-total: 10
        max-idle: 5  
        min-idle: 2
        max-wait-millis: 30000
        test-on-borrow: true
        test-on-return: true
        test-while-idle: true
        time-between-eviction-runs-millis: 30000
        min-evictable-idle-time-millis: 300000

jwt:
  # JWT密钥 - 使用base64编码的秘钥
  secret: ZGF0YXNvcGhvbkpXVFNlY3JldEtleUZvclNwcmluZ0Jvb3QzQXBwbGljYXRpb25TZWNyZXQ=
  # Token有效期（毫秒）- 默认24小时
  expiration: 86400000

# 应用自定义配置
app:
  headers:
    names:
      - Authorization
      - X-User-Id
      - X-Tenant-Id
      - X-Client-Version
      - X-Request-ID
      - grafanaHost
      # 可以添加更多需要处理的请求头
