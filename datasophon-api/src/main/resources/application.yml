# Tomcat
server:
  port: ${server.port:8081}
  address: ${server.ip:0.0.0.0}
  servlet:
    context-path: /ddh/
security:
  authentication:
    type: PASSWORD

arthas:
  telnet-port: -1
  http-port: -1
# mysql
spring:
  config:
    import: classpath:checker-config.yml
  datasource:
    driver-class-name: ${datasource.driver:com.mysql.cj.jdbc.Driver}
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${datasource.url:}
    username: ${datasource.username:datasophon}
    password: ${datasource.password:datasophon}
    # Druid连接池配置 - 解决启动慢问题的关键配置
    druid:
      # 初始连接数，启动时建立的连接数
      initial-size: 5
      # 最小空闲连接数，保持的最小连接数
      min-idle: 5
      # 最大活跃连接数
      max-active: 20
      # 获取连接等待超时时间(毫秒)
      max-wait: 3000
      # 连接有效性检测时间间隔(毫秒)
      time-between-eviction-runs-millis: 60000
      # 连接在池中最小生存的时间(毫秒)
      min-evictable-idle-time-millis: 300000
      # 用来检测连接是否有效的sql，要求是一个查询语句
      validation-query: SELECT 1
      # 申请连接时执行validationQuery检测连接是否有效，开启会降低性能，默认为true
      test-on-borrow: false
      # 归还连接时执行validationQuery检测连接是否有效，开启会降低性能，默认为true
      test-on-return: false
      # 申请连接的时候检测，建议配置为true，不影响性能，并且保证安全性
      test-while-idle: true
      # 是否缓存preparedStatement，也就是PSCache，PSCache对支持游标的数据库性能提升巨大
      pool-prepared-statements: true
      # 要启用PSCache，必须配置大于0，当大于0时，poolPreparedStatements自动触发修改为true
      max-pool-prepared-statement-per-connection-size: 20
      # 配置监控统计拦截的filters，stat:监控统计、log4j：日志记录、wall：防御sql注入
      filters: stat,wall
      # 合并多个DruidDataSource的监控数据
      use-global-data-source-stat: true
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500
  #json格式化全局配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    date-format: yyyy-MM-dd HH:mm:ss
    view:
      suffix: .html
  #国际化配置
  messages:
    basename: i18n/messages
    encoding: UTF-8
  main:
    allow-circular-references: true
  web:
    resources:
      static-locations:
        classpath:/META-INF/resources/,
        classpath:/resources/,
        classpath:/static/,
        classpath:/public/,
        classpath:/front/views/,
        classpath*:/lic/

management:
  endpoints:
    web:
      exposure:
        include: "*"  # 暴露所有端点（生产环境慎用）
        # include: health,info,metrics  # 按需指定
      base-path: /monitor  # 自定义基础路径（默认/actuator）

# Jasypt加密配置
jasypt:
  encryptor:
    algorithm: PBEWithMD5AndDES
    # 加密密钥可以通过环境变量或启动参数设置: -Djasypt.encryptor.password=your_key
    password: ${JASYPT_PASSWORD}
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

# Prometheus监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
    loggers:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name:datasophon-api}
    enable:
      jvm: true
      logback: true
      process: true
      system: true

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.datasophon.dao.entity
  typeEnumsPackage: com.datasophon.dao.enums,com.datasophon.domain.host.enums
  global-config:
    #数据库相关配置
    db-config:
      #主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
      id-type: AUTO
      #字段策略 IGNORED:"忽略判断",NOT_NULL:"非 NULL 判断"),NOT_EMPTY:"非空判断"
      field-strategy: NOT_NULL
      #驼峰下划线转换
      column-underline: true
      logic-delete-value: -1
      logic-not-delete-value: 0
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    # 开启二级缓存
    cache-enabled: true
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    # 设置执行器类型为REUSE，复用PreparedStatement
    default-executor-type: reuse
    # 设置合理的超时时间(秒)
    default-statement-timeout: 30
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  config: classpath:logback-api.xml

datasophon:
  migration:
    enable: ${datasophon.migration.enable:true}

sa-token:
  # SSO-相关配置
  sso:
    auth-url: ${sso.auth-url:https://192.168.5.184:10000/index.html} # 单点登录登录页面地址url
    # 是否打开单点注销接口
    is-slo: true
    server-url: ${sso.server-url:https://192.168.5.174:10000/sso-server/}
    servicecode: NOAH # 系统编码
    public-key: ${sso.public-key:MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCerqMJBTLxl/5ozlNeysw/SwuOPiqTTKd/j1MCm/2Zj/79VJ0FFvhKtOzOBYhoIu/QtlJPG2Lxrw3vNMksyqMiZ8Wca6a1/DgTicD/t8uTzx6buvfIR7GwccK1a/7u1mL2ZqddTIlmkvx/0IiAxXV2pDnQn1QS400O/xKr6RdXywIDAQAB}
    exclude-urls:
      - /sso/getSsoAuthUrl
      - /sso/doLoginByTicket
      - /sso/isLogin
      - /login
      - /signOut
      - /ssoEnable
      - /
      - /static/**
      - /webjars/**
      - /ui/**
    active: ${sso.active:true}
    isHttp: true
  #是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录) =-1
  isConcurrent: true
  #在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  isShare: false
  # 是否使用redis存储信息，默认false使用内存来存储信息，true使用spring redis存储信息（请配置spring redis），若配置下述alone-redis，则使用下述alone-redis存储信息（不必再配置spring redis）。
  redis-enabled: true
  # 配置Sa-Token单独使用的Redis连接 （此处需要和SSO-Server端连接同一个Redis）
  alone-redis:
    #是否启用独立的redis来存储信息，此处为true时，redis-enabled也要设置为true
    enabled: true
    cluster:
      nodes: ${sso.redis-nodes:192.168.5.160:6379,192.168.5.161:6379,192.168.5.162:6379}
      # Redis服务器连接密码（默认为空）
    password: ${sso.redis-password:}
    # 连接超时时间 - 优化减少启动等待时间
    timeout: 3s
    lettuce:
      pool:
        # 连接池最大连接数 - 减少连接数
        max-active: 50
        # 连接池最大阻塞等待时间（使用负值表示没有限制） - 减少等待时间
        max-wait: 3000ms
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池中的最小空闲连接
        min-idle: 2