# 虚拟线程配置文件
# 启用JDK 21虚拟线程支持

# 启用虚拟线程
spring.threads.virtual.enabled=true

# Jetty服务器配置
server.jetty.threads.max=1000
server.jetty.threads.min=10
server.jetty.threads.idle-timeout=60000

# 任务执行配置
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=1000
spring.task.execution.pool.queue-capacity=1000
spring.task.execution.thread-name-prefix=vt-task-

# 调度任务配置
spring.task.scheduling.pool.size=10
spring.task.scheduling.thread-name-prefix=vt-scheduling-

# 应用信息
spring.application.name=DataSophon-VirtualThreads-Enhanced
spring.application.version=3.0.0-JDK21

# 日志配置
logging.level.com.datasophon=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# 监控配置
management.endpoints.web.exposure.include=health,info,metrics,threaddump
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true