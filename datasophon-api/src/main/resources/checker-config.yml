# 检查项配置
datasophon:
  checker:
    # 元数据路径配置
    meta:
      # 版本目录路径，可以配置为DDP-1.2.0,DDP-1.2.1等
      versions: DDP-1.2.1
      # 元数据基础目录
      # 开发环境默认使用 classpath:meta
      # 生产环境默认使用 ${user.dir}/conf/meta
      base-dir: ${META_BASE_DIR:classpath:meta}
    
    # CPU检查配置
    cpu:
      # 最小核心数要求
      min-cores: 4
      # 建议核心数
      recommended-cores: 8
    
    # 内存检查配置
    memory:
      # 最小内存要求(MB)
      min-memory: 8192
      # 建议内存(MB)
      recommended-memory: 16384
      # 交换区最小值(MB)
      min-swap: 4096
    
    # Java环境检查配置
    java:
      # 最小版本要求
      min-version: 1.8
      # 默认JDK路径
      default-path: /usr/local/jdk1.8.0_333
      # 是否检查默认路径
      check-default-path: true
      
      # JDK包配置
      packages:
        # 存储库中JDK子目录（固定为jdk/）
        repository-sub-dir: jdk/
        
        # 默认JDK版本（用于非高级模式）
        default-version: JDK21
        
        # 是否启用高级选择（让用户选择版本和架构）
        advanced-selection-enabled: false
        
        # 可用JDK版本列表（实际存储库中的文件名）
        available-versions:
          - version: JDK21
            display-name: "JDK 21"
            filename: jdk-21_linux-x64_bin.tar.gz
            description: "OpenJDK 21 LTS (推荐)"
          - version: JDK11
            display-name: "JDK 11"
            filename: jdk-11.0.21.tar.gz
            description: "OpenJDK 11 LTS"
          - version: JDK8
            display-name: "JDK 8"
            filename: jdk-8u333-linux-x64.tar.gz
            description: "Oracle JDK 8"
    
    # 磁盘空间检查配置
    disk:
      # 检查目录列表
      check-directories:
        - path: /opt
          min-available-gb: 100
        - path: /var/log
          min-available-gb: 50
        - path: /tmp
          min-available-gb: 30
      # 全局最小可用空间百分比
      min-available-percent: 20
    
    # 文件句柄数配置
    file-handle:
      min-limit: 65535
    
    # 时间同步配置
    time-sync:
      enabled: true                       # 是否启用时间同步检查
      priority: 2                         # 检查优先级
      timeout-seconds: 30                 # 检查超时时间
      max-time-diff: 10                   # 最大允许时间偏差(秒)
      max-time-diff-seconds: 1            # 最大允许时间差（秒）- 用于环境检查
      sync-command: "date -s"             # 同步命令
    
    # 用户和组检查配置
    user-group:
      # 是否自动创建不存在的用户和组
      auto-create: true
      # 默认用户组映射，当用户不存在时根据此映射创建
      default-group-mappings:
        hdfs: hadoop
        yarn: hadoop
        hbase: hadoop
        hive: hadoop
        spark: hadoop
        kafka: hadoop
        mapred: hadoop

    # SSH连接池配置
    ssh-connection-pool:
      # 空闲连接超时时间(毫秒)，默认30秒
      idle-timeout-ms: 30000
      # 连接清理间隔(毫秒)，默认30秒
      cleanup-interval-ms: 30000
      # 连接池最大大小，默认100
      max-pool-size: 10
      # 健康检查的命令
      health-check-command: "echo connection_test"

    # SSH免密检查配置
    ssh-passwordless:
      enabled: true                       # 是否启用SSH免密检查
      priority: 1                         # 检查优先级（数字越小优先级越高）
      timeout-seconds: 30                 # 检查超时时间
      public-key-paths:                   # 公钥文件路径列表
        - ~/.ssh/id_rsa.pub
        - ~/.ssh/id_ecdsa.pub
        - ~/.ssh/id_ed25519.pub
      private-key-paths:                  # 私钥文件路径列表
        - ~/.ssh/id_rsa
        - ~/.ssh/id_ecdsa
        - ~/.ssh/id_ed25519
      public-key-path: ~/.ssh/id_rsa.pub  # 主公钥文件路径
      private-key-path: ~/.ssh/id_rsa     # 主私钥文件路径
      auto-generate-key: true             # 自动生成密钥对
      key-type: rsa                       # 密钥类型
      key-bits: 2048                      # 密钥位数

    # 系统信息收集配置
    system-info:
      enabled: true                       # 是否启用系统信息收集
      priority: 2                         # 检查优先级
      timeout-seconds: 60                 # 收集超时时间
      collect-items:                      # 收集项配置
        os-info: true                     # 操作系统信息
        hardware-info: true               # 硬件信息
        network-info: true                # 网络信息
        mount-info: true                  # 挂载信息
        process-info: false               # 进程信息（可选）
        service-info: true                # 系统服务信息

    # 防火墙检查配置
    firewall:
      enabled: true                       # 是否启用防火墙检查
      priority: 8                         # 检查优先级
      timeout-seconds: 30                 # 检查超时时间
      auto-disable: false                 # 是否自动禁用防火墙（建议关闭）
      check-services:                     # 需要检查的防火墙服务
        - firewalld
        - iptables
        - ufw

    # SELinux检查配置
    selinux:
      enabled: true                       # 是否启用SELinux检查
      priority: 9                         # 检查优先级
      timeout-seconds: 30                 # 检查超时时间
      auto-disable: false                 # 是否自动禁用SELinux（建议关闭）
      allowed-modes:                      # 允许的SELinux模式
        - disabled
        - permissive

    # 系统服务检查配置
    services:
      enabled: true                       # 是否启用系统服务检查
      priority: 10                        # 检查优先级
      timeout-seconds: 45                 # 检查超时时间
      required-services:                  # 必需的系统服务
        - sshd
        - chronyd
      blocked-services:                   # 不允许运行的服务
        - postfix
        - sendmail

    # Hosts文件检查配置（全局检查）
    hosts-file:
      enabled: true                       # 是否启用hosts文件检查
      priority: 101                       # 检查优先级（全局检查）
      timeout-seconds: 60                 # 检查超时时间
      auto-sync: false                    # 是否自动同步hosts文件
      backup-before-modify: true          # 修改前是否备份
      managed-marker-start: "# DataSophon Managed Hosts - START"  # 管理段开始标记
      managed-marker-end: "# DataSophon Managed Hosts - END"      # 管理段结束标记
      backup-suffix: ".datasophon.bak"    # 备份文件后缀
      preserve-entries:                   # 需要保留的系统默认条目
        - "127.0.0.1"
        - "::1"
        - "localhost"
    
    # 主机名检查配置（全局检查）
    hostname:
      enabled: true                       # 是否启用主机名检查
      priority: 100                       # 检查优先级（全局检查）
      timeout-seconds: 60                 # 检查超时时间
      recommended-prefixes:               # 推荐的主机名前缀
        - bigdata
        - bdp
        - hadoop
      default-prefix: bigdata             # 默认前缀
      suffix-formats:                     # 后缀递增格式
        - name: "数字递增"
          pattern: "{prefix}{index}"
          example: "bigdata1, bigdata2, bigdata3"
        - name: "两位补零"
          pattern: "{prefix}{index:02d}"
          example: "bigdata01, bigdata02, bigdata03"
        - name: "三位补零"
          pattern: "{prefix}{index:03d}"
          example: "bigdata001, bigdata002, bigdata003"
      default-format-index: 1             # 默认使用两位补零

    # 主机校验流程控制配置
    validation-flow:
      # 并发控制
      max-concurrent-hosts: 20            # 最大并发主机数
      max-concurrent-items: 5             # 单主机最大并发检查项数
      
      # 超时配置
      global-timeout-minutes: 30          # 全局校验超时（分钟）
      item-timeout-seconds: 300           # 单项检查超时（秒）
      
      # 重试配置
      max-retry-attempts: 3               # 最大重试次数
      retry-delay-seconds: 5              # 重试延迟（秒）
      
      # 依赖关系配置
      respect-dependencies: true          # 是否遵循检查项依赖关系
      fail-fast: false                    # 是否快速失败（有失败项时立即停止）
      
      # 跳过配置
      allow-skip: true                    # 是否允许跳过检查项
      auto-skip-on-failure: false         # 失败时是否自动跳过后续检查项

    # 修复功能配置
    repair:
      enabled: true                       # 是否启用修复功能
      auto-repair: false                  # 是否自动修复（建议关闭）
      confirmation-required: true         # 是否需要确认才能修复
      backup-before-repair: true          # 修复前是否备份
      max-repair-attempts: 3              # 最大修复尝试次数
      repair-timeout-seconds: 180         # 修复超时时间（秒）
      
      # 支持修复的检查项
      supported-items:
        ssh-passwordless: true
        java-env: true
        firewall: true
        selinux: true
        file-handle-limit: true
        hosts-file: true
        services: true

    # 日志记录配置
    logging:
      # 基础配置
      enabled: true                       # 是否启用日志记录
      verbose: false                      # 是否启用详细日志
      max-entries-per-host: 1000          # 单主机最大日志条数
      retention-hours: 24                 # 日志保留时间（小时）
      
      # 日志级别配置
      levels:
        ssh-connection: INFO
        ssh-passwordless: INFO
        system-info: DEBUG
        checks: INFO
        repairs: WARN
        errors: ERROR
      
      # 输出配置
      output:
        console: true                     # 是否输出到控制台
        file: false                       # 是否输出到文件
        sse: true                         # 是否通过SSE推送

    # 调度器配置（基于现有db-scheduler）
    scheduler:
      enabled: true                       # 是否启用调度器
      virtual-threads: true               # 是否使用虚拟线程（JDK21特性）
      threads: 10                         # 调度器线程数（virtual-threads=false时生效）
      polling-interval-seconds: 10        # 任务轮询间隔（秒）
      heartbeat-interval-minutes: 5       # 心跳间隔（分钟）
      
      # 任务配置
      tasks:
        validation:
          max-execution-time-minutes: 60  # 校验任务最大执行时间
          retry-on-failure: true          # 失败时是否重试
        repair:
          max-execution-time-minutes: 30  # 修复任务最大执行时间
          retry-on-failure: false         # 失败时是否重试
        cleanup:
          execution-time-minutes: 30      # 清理任务延迟执行时间

    # 实时通信配置（SSE）
    realtime:
      sse:
        enabled: true                     # 是否启用SSE
        timeout-seconds: 300              # SSE连接超时时间
        heartbeat-interval-seconds: 30    # 心跳间隔
        max-connections-per-cluster: 50   # 单集群最大连接数
        buffer-size: 1000                 # 消息缓冲区大小
      
      # 状态推送配置
      push:
        status-updates: true              # 是否推送状态更新
        log-messages: true                # 是否推送日志消息
        progress-updates: true            # 是否推送进度更新
        batch-size: 10                    # 批量推送大小
        flush-interval-ms: 100            # 推送刷新间隔

    # 缓存配置
    cache:
      enabled: true                       # 是否启用缓存
      validation-sessions:
        max-size: 100                     # 校验会话最大缓存数量
        expire-after-write-minutes: 60    # 写入后过期时间
        expire-after-access-minutes: 30   # 访问后过期时间
      
      system-info:
        max-size: 200                     # 系统信息最大缓存数量
        expire-after-write-minutes: 180   # 写入后过期时间（系统信息变化较慢）

    # 通知配置
    notifications:
      enabled: false                      # 是否启用通知（可选功能）
      channels:                           # 通知渠道
        email: false
        webhook: false
        sms: false
      
      # 通知事件
      events:
        validation-completed: true        # 校验完成通知
        validation-failed: true           # 校验失败通知
        repair-completed: false           # 修复完成通知（可选）

  # 修复命令配置
  repair-commands:
    # JDK安装修复（通用脚本，自动检测系统）
    java: |
      # 临时路径，后续替换为实际JDK包路径
      JDK_PACKAGE="/opt/datasophon/packages/jdk1.8.0_333.tar.gz"
      JDK_INSTALL_DIR="/usr/local"
      
      if [ ! -f "$JDK_PACKAGE" ]; then
        echo "JDK安装包不存在: $JDK_PACKAGE"
        exit 1
      fi
      
      tar -zxf $JDK_PACKAGE -C $JDK_INSTALL_DIR
      
      # 配置环境变量（兼容不同系统）
      if [ -f /etc/profile ]; then
        if ! grep -q "JAVA_HOME=/usr/local/jdk1.8.0_333" /etc/profile; then
          echo 'export JAVA_HOME=/usr/local/jdk1.8.0_333' >> /etc/profile
          echo 'export PATH=$JAVA_HOME/bin:$PATH' >> /etc/profile
        fi
      fi
      source /etc/profile 2>/dev/null || true
    
    # 防火墙禁用（多系统适配）
    firewall: |
      # 检测操作系统类型
      if [ -f /etc/os-release ]; then
        . /etc/os-release
        OS_ID=$ID
      else
        OS_ID="unknown"
      fi
      
      # CentOS/RHEL/麒麟（基于RHEL）
      if [[ "$OS_ID" =~ ^(centos|rhel|kylin)$ ]] || command -v firewalld &> /dev/null; then
        systemctl stop firewalld 2>/dev/null || true
        systemctl disable firewalld 2>/dev/null || true
        systemctl stop iptables 2>/dev/null || true
        systemctl disable iptables 2>/dev/null || true
      fi
      
      # Ubuntu/Debian
      if [[ "$OS_ID" =~ ^(ubuntu|debian)$ ]] || command -v ufw &> /dev/null; then
        ufw disable 2>/dev/null || true
        systemctl stop ufw 2>/dev/null || true
        systemctl disable ufw 2>/dev/null || true
      fi
      
      # 通用iptables清理
      iptables -F 2>/dev/null || true
      iptables -X 2>/dev/null || true
      iptables -P INPUT ACCEPT 2>/dev/null || true
      iptables -P FORWARD ACCEPT 2>/dev/null || true
      iptables -P OUTPUT ACCEPT 2>/dev/null || true
    
    # SELinux禁用（CentOS/RHEL/麒麟）
    selinux: |
      # 检查SELinux是否存在
      if command -v getenforce &> /dev/null; then
        setenforce 0 2>/dev/null || true
        
        # 永久禁用
        if [ -f /etc/selinux/config ]; then
          sed -i 's/^SELINUX=enforcing/SELINUX=disabled/' /etc/selinux/config
          sed -i 's/^SELINUX=permissive/SELINUX=disabled/' /etc/selinux/config
        fi
      else
        echo "SELinux not installed, skip"
      fi
    
    # 文件句柄限制修复（通用）
    file-handle: |
      # 检查并添加配置（避免重复）
      if [ -f /etc/security/limits.conf ]; then
        if ! grep -q "^\* soft nofile 65535" /etc/security/limits.conf; then
          echo "* soft nofile 65535" >> /etc/security/limits.conf
        fi
        if ! grep -q "^\* hard nofile 65535" /etc/security/limits.conf; then
          echo "* hard nofile 65535" >> /etc/security/limits.conf
        fi
      fi
      
      # 临时生效
      ulimit -n 65535 2>/dev/null || true

  # 操作系统支持配置
  system:
    # 支持的操作系统列表
    supported-os:
      - id: centos
        versions: [7, 8]
        family: rhel
      - id: ubuntu
        versions: [20.04, 22.04, 24.04]
        family: debian
      - id: kylin
        versions: [v10, v4]
        family: rhel  # 银河麒麟基于RHEL