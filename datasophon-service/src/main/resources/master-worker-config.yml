# Master到Worker反向连接配置
master-worker:
  # Worker发现配置
  discovery:
    # 是否启用Worker自动发现
    enabled: true
    # 发现间隔（秒）
    discovery-interval: 300
    # 连接超时时间（秒）
    connection-timeout: 30
    # 最大重试次数
    max-retry-attempts: 3
    # 重试间隔（秒）
    retry-interval: 10

  # 健康检查配置
  health-check:
    # 是否启用健康检查
    enabled: true
    # 健康检查间隔（秒）
    check-interval: 60
    # 健康检查超时（秒）
    check-timeout: 30
    # 关键节点检查间隔（秒）
    critical-check-interval: 30

  # 连接管理配置
  connection:
    # 连接池大小
    pool-size: 10
    # 最大并发连接数
    max-concurrent-connections: 50
    # 连接保活时间（秒）
    keep-alive-time: 300
    # 空闲连接超时（秒）
    idle-timeout: 600

  # Worker节点配置
  worker:
    # Worker端口
    port: 2552
    # Actor路径模式
    actor-path-pattern: "akka://datasophon@{hostname}:{port}/user/worker"
    # 系统信息收集超时（秒）
    system-info-timeout: 60

  # 日志配置
  logging:
    # 是否启用详细日志
    verbose: false
    # 日志级别
    level: INFO
    # 是否记录连接详情
    log-connections: true
    # 是否记录健康检查详情
    log-health-checks: false
