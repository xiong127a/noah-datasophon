# DataSophon主配置文件
spring:
  application:
    name: datasophon-service
  profiles:
    active: default
    include: db-scheduler

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /datasophon

# 数据库配置
datasource:
  url: jdbc:mysql://localhost:3306/datasophon?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
  username: datasophon
  password: datasophon123
  driver-class-name: com.mysql.cj.jdbc.Driver

# 插件配置
datasophon:
  plugins:
    # 插件目录
    directory: ${user.dir}/plugins
    
    # 开发模式配置
    development:
      # 是否启用开发模式（开发时设为true，生产时设为false）
      enabled: true
      # 开发模式下的插件路径（编译后的JAR位置）
      plugin-paths:
        - datasophon-plugins/datasophon-plugins-impl/core-plugins/ssh-connector-plugin/target
        - datasophon-plugins/datasophon-plugins-impl/core-plugins/cpu-checker-plugin/target
    
    # 额外的插件扫描路径（可选）
    scan-paths: []
    
    # 插件加载配置
    loading:
      enabled: true
      lazy: true
      hot-reload: true
      
    # SSH连接池配置
    ssh-connection-pool:
      # 全局默认配置
      default:
        max-total: 10
        max-idle: 5
        min-idle: 2
        max-wait-millis: 30000
        test-on-borrow: true
        test-on-return: true
        test-while-idle: true
        time-between-eviction-runs-millis: 30000
        min-evictable-idle-time-millis: 300000
        
      # 主机特定配置（可选）
      hosts:
        "192.168.1.100":
          max-total: 20
          max-idle: 10
        "192.168.1.101":
          max-total: 15
          max-idle: 8

# 日志配置
logging:
  level:
    com.datasophon: INFO
    com.datasophon.plugins: DEBUG
    org.apache.commons.pool2: DEBUG
    # db-scheduler相关日志
    com.github.kagkarlsson.scheduler: INFO
    no.bekk.db-scheduler-ui: INFO
    io.rocketbase.extension: INFO
    root: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

---
# db-scheduler 配置
spring:
  profiles: db-scheduler

# db-scheduler基础配置
db-scheduler:
  enabled: true
  table-name: scheduled_tasks
  scheduler-name: datasophon-scheduler
  polling-interval: PT10S
  heartbeat-interval: PT30S
  delete-unresolved-after: P7D
  immediate-execution-enabled: true
  upper-limit-fraction-of-threads: 0.8
  shutdown:
    max-wait: PT30S

# db-scheduler-ui 可视化界面配置
db-scheduler-ui:
  enabled: true                    # 启用Web UI界面
  path: /db-scheduler             # UI访问路径: http://localhost:8080/datasophon/db-scheduler
  auth:
    enabled: false                 # 暂时禁用认证（生产环境建议启用）
  refresh-interval: 5s            # 页面自动刷新间隔
  show-data: true                 # 显示任务数据内容
  show-logs: true                 # 显示任务执行日志
  page-size: 50                   # 每页显示任务数量

# db-scheduler-log 任务历史记录配置
db-scheduler-log:
  enabled: true                   # 启用任务执行历史记录
  table-name: scheduled_execution_logs  # 历史记录表名
  cleanup:
    enabled: true                 # 启用历史记录自动清理
    max-age: P30D                # 保留30天的执行历史
    cleanup-interval: PT1H       # 每小时执行一次清理任务