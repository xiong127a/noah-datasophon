apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  labels:
    name: "prometheus-prometheus"
  name: "prometheus-prometheus"
  namespace: datasophon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "prometheus-prometheus"
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  minReadySeconds: 5
  revisionHistoryLimit: 10
  template:
    metadata:
      labels:
        name: "prometheus-prometheus"
        app: "prometheus-prometheus"
        podConflictName: "prometheus-prometheus"
      annotations:
        serviceInstanceName: "prometheus"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  name: "prometheus-prometheus"
                  podConflictName: "prometheus-prometheus"
              namespaces:
                - "datasophon"
              topologyKey: "kubernetes.io/hostname"
      hostPID: false
      hostNetwork: false
      containers:
        - env:
            - name: USER
              value: root
            - name: MEM_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          image: "192.168.5.200:5000/bdp/prometheus:2.17.2"
          imagePullPolicy: "Always"
          command:
            - "/bin/bash"
            - "-c"
            - "cd /opt/datasophon/prometheus-2.17.2 && sh control.sh start prometheus && exec tail -f /dev/null"
          readinessProbe:
            exec:
              command:
                - "/bin/bash"
                - "-c"
                - "cd /opt/datasophon/prometheus-2.17.2 && sh control.sh status prometheus"
            failureThreshold: 3
            initialDelaySeconds: 3
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 15
          name: "prometheus-prometheus"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: "/opt/datasophon/prometheus-2.17.2/configs"
              name: "configs"
            - mountPath: "/opt/datasophon/prometheus-2.17.2/prometheus.yml"
              name: "config1"
            - mountPath: "/opt/datasophon/prometheus-2.17.2/logs"
              name: "logs"
            - mountPath: "/etc/localtime"
              name: "timezone"
      nodeSelector:
        prometheus-prometheus: "true"
      terminationGracePeriodSeconds: 30
      volumes:
        - hostPath:
            path: "/opt/datasophon/prometheus-2.17.2/configs"
          name: "configs"
        - hostPath:
            path: "/opt/datasophon/prometheus-2.17.2/prometheus.yml"
          name: "config1"
        - hostPath:
            path: "/opt/datasophon/prometheus-2.17.2/logs"
          name: "logs"
        - hostPath:
            path: "/etc/localtime"
          name: "timezone"